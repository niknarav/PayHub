syntax = "proto3";

package payhub.acquirer.v1;

option go_package = "github.com/niknarav/payhub/contracts/gen/go/payhub/acquirer/v1;acquirerv1";
option java_multiple_files = true;
option java_package = "ru.payhub.contracts.acquirer.v1";

service AcquirerService {
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  rpc Capture(CaptureRequest) returns (CaptureResponse);
  rpc Void(VoidRequest) returns (VoidResponse);
  rpc Refund(RefundRequest) returns (RefundResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

enum AuthorizeResult {
  AUTHORIZE_RESULT_UNSPECIFIED = 0;
  AUTHORIZE_RESULT_APPROVED = 1;
  AUTHORIZE_RESULT_DECLINED = 2;
}

enum DeclineCode {
  DECLINE_CODE_UNSPECIFIED = 0;
  DECLINE_CODE_INSUFFICIENT_FUNDS = 1;
  DECLINE_CODE_CARD_BLOCKED = 2;
  DECLINE_CODE_LIMIT_EXCEEDED = 3;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_NOT_FOUND = 1;
  OPERATION_STATE_AUTHORIZED = 2;
  OPERATION_STATE_CAPTURED = 3;
  OPERATION_STATE_VOIDED = 4;
  OPERATION_STATE_DECLINED = 5;
}

message AuthorizeRequest {
  string payment_id = 1;
  string card_token = 2;
  int64 amount_minor = 3;
  string currency = 4;
}

message AuthorizeResponse {
  string acquirer_ref = 1;
  AuthorizeResult result = 2;
  DeclineCode decline_code = 3;
}

message CaptureRequest {
  string acquirer_ref = 1;
  int64 amount_minor = 2;
}

message CaptureResponse {
  OperationState state = 1;
  int64 captured_minor = 2;
}

message VoidRequest {
  string acquirer_ref = 1;
}

message VoidResponse {
  OperationState state = 1;
}

message RefundRequest {
  string acquirer_ref = 1;
  string refund_id = 2;
  int64 amount_minor = 3;
}

message RefundResponse {
  string refund_id = 1;
  int64 refunded_total_minor = 2;
}

message GetStatusRequest {
  string payment_id = 1;
}

message GetStatusResponse {
  OperationState state = 1;
  string acquirer_ref = 2;
  int64 authorized_minor = 3;
  int64 captured_minor = 4;
  int64 refunded_minor = 5;
  DeclineCode decline_code = 6;
}